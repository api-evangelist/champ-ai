aid: champ-ai
name: Champ Ai
description: >-
  Champ AI is an AI operations platform that automates complex, multi-step
  enterprise back-office workflows through autonomous agents that browse, read,
  call, and act on behalf of operations teams. Positioned as an AI-native
  replacement for traditional business process outsourcing (BPO), Champ combines
  browser automation across legacy portals and internal tools, document
  intelligence, outbound voice AI, and SOP-to-agent conversion with process
  mining and more than 100 integrations. The platform targets regulated,
  operations-heavy verticals such as healthcare and professional employer
  organizations (PEO), claiming 95%+ accuracy on complex standard operating
  procedures and 4-10x ROI on operational spend. Founded by Jagannath Putrevu,
  Ted Cheng, and Peter Lin (early Instacart operators), Champ AI emerged from
  stealth in May 2026 with an $8.5M seed round led by Redpoint Ventures with
  participation from defy.vc and SV Angel. This profile was surfaced as a
  Redpoint Ventures portfolio company and enriched from the company's public
  website; Champ AI does not currently publish a public developer API, SDKs, or
  API documentation.
